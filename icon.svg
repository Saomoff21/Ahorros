<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.3" stroke-width="4" />

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#10b981" fill-opacity="0.15" filter="url(#glow)" />

  <!-- Shield / Vault Symbol -->
  <path d="M 256 90 L 390 145 C 390 280 256 390 256 390 C 256 390 122 280 122 145 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Inner Shield Trim -->
  <path d="M 256 112 L 370 160 C 370 270 256 364 256 364 C 256 364 142 270 142 160 Z" 
        fill="none" stroke="#6ee7b7" stroke-width="6" stroke-opacity="0.6" />

  <!-- Central Gold Coin / Vault Door -->
  <circle cx="256" cy="235" r="70" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="6" />

  <!-- Currency / Savings Emblem ($) -->
  <text x="256" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="78" font-weight="900" fill="#0f172a" text-anchor="middle" dominant-baseline="central">$</text>

  <!-- Growth Sparkle Dots -->
  <circle cx="370" cy="120" r="10" fill="#34d399" />
  <circle cx="140" cy="120" r="10" fill="#34d399" />
</svg>
